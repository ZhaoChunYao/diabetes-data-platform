name: cs554-pg-demo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: project_554
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && test \"$$(psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT COUNT(*) FROM _docker_init_status WHERE status = 'ready'\")\" = \"1\""]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      DB_DRIVER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: app
      DB_PASS: app_password
      DB_NAME: project_554
      PORT: 5001
    ports:
      - "5002:5001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    # Keep using the existing Phase 2A representative-data volume.
    name: lizhongyusfiles-cs554_final_submission_postgres_data
