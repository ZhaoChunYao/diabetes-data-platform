<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature 2 — Clinical Measurements & Conditions</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container { max-width: 1400px; margin: 0 auto; }
    
    header { text-align: center; color: white; margin-bottom: 40px; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .subtitle { font-size: 1.1rem; opacity: 0.9; }
    
    .back-btn {
      display: inline-block; color: white; text-decoration: none;
      padding: 10px 20px; background: rgba(255,255,255,0.2);
      border-radius: 8px; margin-bottom: 20px; transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.3); }
    
    .card {
      background: white; border-radius: 12px; padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 30px;
    }
    
    .control-group {
      display: flex; gap: 10px; margin-bottom: 20px; align-items: center;
    }
    
    label { font-weight: 600; color: #495057; margin-right: 10px; }
    
    select, button {
      padding: 10px 15px; font-size: 14px; border: 1px solid #ced4da;
      border-radius: 6px;
    }
    
    button {
      background: #667eea; color: white; border: none;
      cursor: pointer; font-weight: 600; transition: background 0.2s;
    }
    button:hover { background: #5568d3; }
    
    .chart-container { margin-top: 20px; }
    .loading { text-align: center; padding: 40px; color: #666; }
    
    table {
      width: 100%; border-collapse: collapse; margin-top: 20px;
    }
    
    th, td {
      padding: 12px; text-align: left; border-bottom: 1px solid #eee;
    }
    
    th {
      background: #f8f9fa; font-weight: 600; color: #495057;
      text-transform: uppercase; font-size: 0.85rem;
    }
    
    tbody tr:hover { background: #f8f9fa; }
    
    svg { font-family: system-ui, sans-serif; }
    .axis text { font-size: 12px; }
    .axis path, .axis line { stroke: #888; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-btn">← Back to Home</a>
    
    <header>
      <h1>Feature 2 — Clinical Measurements & Conditions</h1>
      <p class="subtitle">Explore clinical measurements and health conditions by study group</p>
    </header>
    
    <div class="card">
      <h2>Measurement Analysis</h2>
      <div class="control-group">
        <label>Select Measurement:</label>
        <select id="measurement_select" style="min-width: 300px;">
          <option value="">Loading...</option>
        </select>
        <button onclick="loadMeasurement()">Analyze Measurement</button>
      </div>
      
      <div class="chart-container" id="measurement_summary_chart"></div>
    </div>
    
    <div class="card">
      <h2>Condition Analysis</h2>
      <div class="control-group">
        <label>Select Condition:</label>
        <select id="condition_select" style="min-width: 300px;">
          <option value="">Loading...</option>
        </select>
        <button onclick="loadCondition()">Analyze Condition</button>
      </div>
      
      <div class="chart-container" id="condition_count_chart"></div>
      
      <h3 style="margin-top: 30px;">Condition Records</h3>
      <div id="condition_table_container"></div>
    </div>
  </div>
  
  <script>
    const API_BASE = '';
    
    const groupNames = {
      "pre_diabetes_lifestyle_controlled": "Pre-Diabetes",
      "oral_medication_and_or_non_insulin_injectable_medication_controlled": "Non-Insulin Medication",
      "insulin_dependent": "Insulin Dependent",
      "healthy": "Healthy"
    };
    
    // Load options on page load
    async function loadOptions() {
      try {
        const [measurements, conditions] = await Promise.all([
          fetch(`${API_BASE}/api/feature2/measurement_options`).then(r => r.json()),
          fetch(`${API_BASE}/api/feature2/condition_options`).then(r => r.json())
        ]);
        
        const measurementSelect = document.getElementById('measurement_select');
        measurementSelect.innerHTML = '<option value="">-- Select a measurement --</option>';
        measurements.forEach(m => {
          const option = document.createElement('option');
          option.value = m.measurement_source_value;
          option.textContent = m.measurement_source_value;
          measurementSelect.appendChild(option);
        });
        
        const conditionSelect = document.getElementById('condition_select');
        conditionSelect.innerHTML = '<option value="">-- Select a condition --</option>';
        conditions.forEach(c => {
          const option = document.createElement('option');
          option.value = c.condition_source_value;
          option.textContent = c.condition_source_value;
          conditionSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading options:', error);
      }
    }
    
    async function loadMeasurement() {
      const sourceValue = document.getElementById('measurement_select').value;
      if (!sourceValue) {
        alert('Please select a measurement');
        return;
      }
      
      try {
        const data = await fetch(`${API_BASE}/api/feature2/measurement_summary?source_value=${encodeURIComponent(sourceValue)}`)
          .then(r => r.json());
        drawMeasurementSummary(data, sourceValue);
      } catch (error) {
        console.error('Error loading measurement:', error);
        document.getElementById('measurement_summary_chart').innerHTML = '<div class="loading">Error loading data</div>';
      }
    }
    
    async function loadCondition() {
      const sourceValue = document.getElementById('condition_select').value;
      if (!sourceValue) {
        alert('Please select a condition');
        return;
      }
      
      try {
        const [counts, records] = await Promise.all([
          fetch(`${API_BASE}/api/feature2/condition_counts?source_value=${encodeURIComponent(sourceValue)}`).then(r => r.json()),
          fetch(`${API_BASE}/api/feature2/conditions?source_value=${encodeURIComponent(sourceValue)}`).then(r => r.json())
        ]);
        
        drawConditionCountChart(counts, sourceValue);
        drawConditionTable(records);
      } catch (error) {
        console.error('Error loading condition:', error);
        document.getElementById('condition_count_chart').innerHTML = '<div class="loading">Error loading data</div>';
      }
    }
    
    function drawMeasurementSummary(data, measurementName) {
      const container = d3.select("#measurement_summary_chart");
      container.html("");
      
      if (!data || data.length === 0) {
        container.html('<div class="loading">No data available for this measurement</div>');
        return;
      }
      
      container.append("h3")
        .style("margin-bottom", "15px")
        .text(`Mean ${measurementName} by Study Group`);
      
      const width = 600, height = 350;
      const svg = container.append("svg")
        .attr("width", width)
        .attr("height", height);
      
      const x = d3.scaleBand()
        .domain(data.map(d => d.study_group))
        .range([80, width - 40])
        .padding(0.3);
      
      const y = d3.scaleLinear()
        .domain([0, d3.max(data, d => parseFloat(d.mean_value) || 0)])
        .range([height - 60, 30]);
      
      // X axis
      svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height - 60})`)
        .call(d3.axisBottom(x).tickFormat(d => groupNames[d] || d));
      
      // Y axis
      svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(80,0)`)
        .call(d3.axisLeft(y));
      
      // Bars
      svg.selectAll("rect")
        .data(data)
        .enter()
        .append("rect")
        .attr("x", d => x(d.study_group))
        .attr("y", d => y(parseFloat(d.mean_value) || 0))
        .attr("width", x.bandwidth())
        .attr("height", d => height - 60 - y(parseFloat(d.mean_value) || 0))
        .attr("fill", "#667eea")
        .on("mouseover", function() { d3.select(this).attr("fill", "#5568d3"); })
        .on("mouseout", function() { d3.select(this).attr("fill", "#667eea"); });
      
      // Value labels
      svg.selectAll(".value-label")
        .data(data)
        .enter()
        .append("text")
        .attr("class", "value-label")
        .attr("x", d => x(d.study_group) + x.bandwidth() / 2)
        .attr("y", d => y(parseFloat(d.mean_value) || 0) - 5)
        .attr("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text(d => d.mean_value ? parseFloat(d.mean_value).toFixed(2) : '0');
    }
    
    function drawConditionCountChart(data, conditionName) {
      const container = d3.select("#condition_count_chart");
      container.html("");
      
      if (!data || data.length === 0) {
        container.html('<div class="loading">No data available for this condition</div>');
        return;
      }
      
      container.append("h3")
        .style("margin-bottom", "15px")
        .text(`Patient Count with ${conditionName} by Study Group`);
      
      const width = 600, height = 350;
      const svg = container.append("svg")
        .attr("width", width)
        .attr("height", height);
      
      const x = d3.scaleBand()
        .domain(data.map(d => d.study_group))
        .range([80, width - 40])
        .padding(0.3);
      
      const y = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.patient_count)])
        .range([height - 60, 30]);
      
      svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height - 60})`)
        .call(d3.axisBottom(x).tickFormat(d => groupNames[d] || d));
      
      svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(80,0)`)
        .call(d3.axisLeft(y));
      
      svg.selectAll("rect")
        .data(data)
        .enter()
        .append("rect")
        .attr("x", d => x(d.study_group))
        .attr("y", d => y(d.patient_count))
        .attr("width", x.bandwidth())
        .attr("height", d => height - 60 - y(d.patient_count))
        .attr("fill", "#ef4444")
        .on("mouseover", function() { d3.select(this).attr("fill", "#dc2626"); })
        .on("mouseout", function() { d3.select(this).attr("fill", "#ef4444"); });
      
      svg.selectAll(".value-label")
        .data(data)
        .enter()
        .append("text")
        .attr("class", "value-label")
        .attr("x", d => x(d.study_group) + x.bandwidth() / 2)
        .attr("y", d => y(d.patient_count) - 5)
        .attr("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text(d => d.patient_count);
    }
    
    function drawConditionTable(data) {
      const container = document.getElementById('condition_table_container');
      
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="loading">No records available</div>';
        return;
      }
      
      let html = `
        <table>
          <thead>
            <tr>
              <th>Person ID</th>
              <th>Condition</th>
              <th>Start Date</th>
              <th>Study Group</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      data.slice(0, 50).forEach(r => {
        html += `
          <tr>
            <td>${r.person_id}</td>
            <td>${r.condition_source_value}</td>
            <td>${r.condition_start_date ? new Date(r.condition_start_date).toLocaleDateString() : 'N/A'}</td>
            <td>${groupNames[r.status] || r.status || 'N/A'}</td>
          </tr>
        `;
      });
      
      html += `</tbody></table>`;
      if (data.length > 50) {
        html += `<p style="margin-top: 10px; color: #666; font-style: italic;">Showing first 50 of ${data.length} records</p>`;
      }
      
      container.innerHTML = html;
    }
    
    // Load options when page loads
    loadOptions();
  </script>
</body>
</html>
