apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs554-app
  namespace: cs554
  labels:
    app.kubernetes.io/name: cs554-app
    app.kubernetes.io/part-of: cs554-healthcare-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cs554-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cs554-app
        app.kubernetes.io/part-of: cs554-healthcare-platform
    spec:
      containers:
        - name: app
          image: cs554-app:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: DB_DRIVER
              value: postgres
            - name: DB_HOST
              value: cs554-postgres-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: project_554
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cs554-db-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: cs554-db-credentials
                  key: password
            - name: PORT
              value: "5001"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cs554-app
  namespace: cs554
  labels:
    app.kubernetes.io/name: cs554-app
    app.kubernetes.io/part-of: cs554-healthcare-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cs554-app
  ports:
    - name: http
      port: 5001
      targetPort: http
      nodePort: 30003
